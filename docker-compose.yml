services:
  db:
    image: postgres:16-alpine
    container_name: mes-postgres
    environment:
      POSTGRES_DB: mes
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: mes
    ports:
      # 對外開 15432 而不是 5432：開發機上本來就常駐一個 PostgreSQL 或別的專案的容器，
      # 直接佔用 5432 會讓 clone 下來的人第一步就撞到 port 衝突。
      # app 容器是走內部網路連 db:5432，這個映射純粹是給你用 GUI 工具連進來看資料的。
      - "15432:5432"
    volumes:
      - mes-pgdata:/var/lib/postgresql/data
    healthcheck:
      # 應用程式必須等資料庫真的可以接受連線才啟動，
      # 只用 depends_on 不夠——容器「起來了」不等於 PostgreSQL「準備好了」。
      test: ["CMD-SHELL", "pg_isready -U mes -d mes"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: mes-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/mes
      DB_USER: mes
      DB_PASSWORD: mes
      JWT_SECRET: local-compose-secret-key-change-me-in-production
      DEMO_DATA_ENABLED: "true"
    ports:
      - "8080:8080"

volumes:
  mes-pgdata:
